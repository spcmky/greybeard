# Disabled: runs only on manual dispatch. There is no deploy target wired up.
# To re-enable automatic CI, restore the pull_request / push triggers below.
#
# When wired to infra: deployment is GitOps: ArgoCD tracks
# helm/tools/greybeard in your infra repo — to roll out a build, bump
# image.tag there to this repo's main sha7. Repo vars (from your infra core
# stack): AWS_ROLE_ARN = the app CI role,
# ECR_IMAGE = <acct>.dkr.ecr.<region>.amazonaws.com/<org>/greybeard.
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # arm64 runner: the EKS node group is Graviton, so test what we ship.
    runs-on: ubuntu-24.04-arm
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry
            target
          key: cargo-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo test
      - run: rustup component add clippy && cargo clippy --all-targets -- -D warnings

  build-push:
    if: github.ref == 'refs/heads/main' && vars.AWS_ROLE_ARN != ''
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      # Job-scoped on purpose — workflow-level id-token:write is exactly what
      # Greybeard's own ci-config lens flags.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push (immutable sha7 tag — never rebuilt, only promoted)
        run: |
          TAG="${GITHUB_SHA::7}"
          docker build -t "${{ vars.ECR_IMAGE }}:$TAG" .
          docker push "${{ vars.ECR_IMAGE }}:$TAG"
          echo "pushed ${{ vars.ECR_IMAGE }}:$TAG"

