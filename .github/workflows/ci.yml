# Lightweight CI: build, test, and lint on every PR and push to main.
# No deploy — there is no image registry / deploy target wired up.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # arm64 runner: the image ships for Graviton, so test what we ship.
    runs-on: ubuntu-24.04-arm
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry
            target
          key: cargo-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo test
      - run: rustup component add clippy && cargo clippy --all-targets -- -D warnings
