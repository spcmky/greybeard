# Lightweight CI: build, test, and lint on every PR and push to main.
# No deploy — there is no image registry / deploy target wired up.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # arm64 runner: the image ships for Graviton, so test what we ship.
    runs-on: ubuntu-24.04-arm
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry
            target
          key: cargo-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo test
      - run: rustup component add clippy && cargo clippy --all-targets -- -D warnings

  build-image:
    name: build image (${{ matrix.platform }})
    # Native matrix runners, not QEMU emulation: cargo/rustc under QEMU is
    # commonly 5-10x slower than native, and GitHub now provides free-tier
    # arm64 hosted runners (ubuntu-24.04-arm) alongside amd64 — the same
    # tradeoff already made for the `test` job above. Each leg here does a
    # real native `docker buildx build`, so there is no emulation involved
    # and results reflect what actually ships on that arch.
    #
    # This only builds and smoke-tests the image per platform; it does not
    # push or assemble a multi-arch manifest list, since no image registry
    # is wired up yet (see header comment). Once a registry is chosen,
    # extend this job (or add a release workflow) to push both platforms
    # and publish a combined manifest list with `docker buildx imagetools`
    # or by adding `push: true` + `platforms: linux/amd64,linux/arm64` in
    # one `docker/build-push-action` step.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runs-on: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: greybeard:ci-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Verify image runs on this arch
        run: docker run --rm greybeard:ci-${{ matrix.arch }} --version
